[package]
name = "matterwave-desktop"
version = "0.3.0"
description = "MatterWave desktop: the web app in a native window, signed in through the system browser"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
# The staticlib/cdylib pair is what Tauri's mobile targets link; rlib is what
# `cargo test` and main.rs use.
name = "matterwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles the Windows resource that gives the test binaries their
# application manifest (build.rs): the updater test needs Common-Controls
# v6 to load.
embed-resource = "3"

[dependencies]
# tray-icon: the system tray (Show and Quit) is part of the app, not a
# build flag like the updater.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
# The global hotkey quick-summon (hotkey.rs): one chord, registered with
# the OS, that toggles the window from anywhere.
tauri-plugin-global-shortcut = "2"
# Size and position survive a restart: saved when the window closes,
# restored at launch, over the config's numbers as the first-run default.
tauri-plugin-window-state = "2"
# Start at login, a Preferences switch: the OS's own login items.
tauri-plugin-autostart = "2"
# On Windows and Linux a deep link starts a second process; this hands its URL
# to the running one, which is the one waiting for the sign-in callback.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Native stores only: Keychain, Credential Manager, Secret Service. Without a
# platform feature keyring 3 falls back to an in-memory mock, which would
# silently sign the person out on every restart.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Native roots, not a bundled list: the dev gateway signs with its own CA,
# which is trusted by installing it in the OS store, not by a code change.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process"] }
# The agent tool host (src/agent): grep, the ignore files and the
# contract's globs compile to `regex` (the walk itself is a port of the
# SDKs', search.rs), and the workspace root is chosen in the OS's own
# folder picker -- rfd, the crate the dialog plugin wraps, used from Rust
# only so no dialog (or fs) permission reaches the webview.
regex = "1"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6", "gtk3"] }

# run_shell's process-tree kill: a job object on Windows, a process group
# (and on Linux a cgroup, where one can be made) on Unix (src/agent/shell.rs);
# and the approval log's owner-only DACL on Windows (src/agent/audit.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The sign-in test runs a fake issuer on loopback inside its own runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The updater test drives the plugin the way updater.rs does, on Tauri's
# mock runtime: no window, no keychain, no installer.
tauri = { version = "2", features = ["test"] }
# The agent tool host's tests build throwaway workspaces.
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
