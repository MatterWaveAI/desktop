name: CI

# Test + lint on every push and every PR (T-240): the release workflow is
# tags only, so this is what catches breakage between releases. Every job
# gates, the packaged build on each OS included: an app that builds but
# will not start is as broken as one that does not compile.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  scripts:
    name: Scripts, workflows and the SPA sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # web/ must be spa/upstream.json's platform commit plus spa/patches,
      # exactly: an edit to web/ that skipped `pnpm spa:refresh` fails here.
      - run: pnpm spa:check
      - run: pnpm test:scripts

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm vitest run
      - run: pnpm build

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Build out of tree. Windows Application Control refuses to run
      # freshly built executables under the repo path (os error 4551); a
      # target directory in the runner's temp works everywhere and keeps
      # the checkout clean. See README.md, "Develop". Set from a step: the
      # runner context does not exist at job level, and a job-level
      # `runner.temp` makes GitHub reject the whole workflow.
      - name: Build out of tree
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  tauri-build:
    name: Tauri build and start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm build
        env:
          # Read at build time; the release job sets the real one.
          MW_DESKTOP_BASE_URL: ${{ vars.MW_DESKTOP_BASE_URL || 'https://app.matterwave.ai' }}
      # The installer or bundle this produced, started once: it must still
      # be running after 20 s (scripts/smoke-packaged-app.mjs).
      - name: Start the packaged app once
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/smoke-packaged-app.mjs --bundle-dir src-tauri/target/release/bundle
      - name: Start the packaged app once (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged-app.mjs --bundle-dir src-tauri/target/release/bundle
