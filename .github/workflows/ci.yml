name: CI

# Test + lint on every push and every PR (T-240): the release workflow is
# tags only, so this is what catches breakage between releases. The web
# job and the Rust job gate; the tauri build matrix below is allowed to
# fail while the runners' toolchains mature.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm vitest run
      - run: pnpm build
      # The SPA's copy of the SDK's agent helpers against the SDK itself
      # (sdk.test.ts): informative, since the SDK's develop can be ahead of
      # or behind the contract this branch carries.
      - name: Check out the TypeScript SDK
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: MatterWaveAI/typescript-sdk
          ref: develop
          path: typescript-sdk
      - name: The vendored agent helpers match the TypeScript SDK
        continue-on-error: true
        if: hashFiles('typescript-sdk/src/agent/contract.ts') != ''
        run: pnpm vitest run src/apps/agent/sdk.test.ts
        env:
          MATTERWAVE_TS_SDK: ${{ github.workspace }}/typescript-sdk

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Build out of tree. Windows Application Control refuses to run
      # freshly built executables under the repo path (os error 4551); a
      # target directory in the runner's temp works everywhere and keeps
      # the checkout clean. See README.md, "Develop". Set from a step: the
      # runner context does not exist at job level, and a job-level
      # `runner.temp` makes GitHub reject the whole workflow.
      - name: Build out of tree
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test
      # The host's copies of the contract and the shared conformance cases
      # against the Python SDK, their source (contract.rs's parity tests).
      # Informative: the SDK's develop moves on its own schedule.
      - name: Check out the Python SDK
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: MatterWaveAI/python-sdk
          ref: develop
          path: python-sdk
      - name: The agent contract copies match the Python SDK
        continue-on-error: true
        if: hashFiles('python-sdk/src/matterwave_sdk/agent/contract.json') != ''
        run: cargo test matches_the_python_sdks -- --nocapture
        env:
          MATTERWAVE_AGENT_CONTRACT: ${{ github.workspace }}/python-sdk/src/matterwave_sdk/agent/contract.json
          MATTERWAVE_AGENT_CONFORMANCE: ${{ github.workspace }}/python-sdk/tests/agent_conformance.json

  agent-host:
    # The agent tool host's own suite where its platform code differs:
    # Windows (the job object and suspended start, junctions, streams,
    # device names, 8.3 names, the approval log's DACL) and macOS (the
    # process group, case-insensitive paths). Linux runs it in the rust job.
    name: Agent host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Build out of tree
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"
      - run: cargo test agent

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Allowed to fail: the bundled build needs each runner's whole
    # toolchain (Rust, the OS webview's dev packages, WiX on Windows), and
    # a runner missing a piece must not hold the branch hostage. Green
    # here means the web and rust jobs passed; a red matrix entry is a
    # sign the runner needs work, not that the code does.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm build
        env:
          # Read at build time; the release job sets the real one.
          MW_DESKTOP_BASE_URL: https://app.matterwave.ai
