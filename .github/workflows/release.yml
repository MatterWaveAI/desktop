name: Release

# A tag push (`v0.2.2`) builds signed installers on all three OSes, attaches
# them and the updater manifests to a GitHub release, and publishes the
# updater feed the installed apps check
# (`<MW_DESKTOP_UPDATES_URL>/desktop/<channel>/<os>/<arch>/<version>`,
# the endpoint scripts/release-config.mjs names). The web and Rust checks
# are CI's job (.github/workflows/ci.yml); this job builds and ships.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#
# | Secret | What |
# |---|---|
# | `TAURI_SIGNING_PRIVATE_KEY` | The updater's private key (`pnpm tauri signer generate`), the base64 string the command prints. Signs every updater artifact; losing it means a new key and every installed app refusing updates from it. |
# | `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` | The private key's password, or empty for none. |
# | `MW_UPDATER_PUBKEY` | The matching public half; written into the build config, carried by every build. |
# | `MW_DESKTOP_UPDATES_URL` | Where the feed lives (e.g. `https://releases.example.com`). Also the base of the endpoint built into the app. |
# | `MW_UPDATER_FEED_TOKEN` | A bearer token the feed accepts `PUT`s from. Without it the release is built and published but the feed keeps the previous version. |
#
# Variables (not secrets):
#
# | Variable | What |
# |---|---|
# | `MW_DESKTOP_CHANNEL` | The feed channel, one per environment (`dev`, `staging`, `prod`). Default `prod`. |
# | `MW_DESKTOP_BASE_URL` | The API the release talks to, read at build time. Default `https://app.matterwave.ai`. |
#
# The feed itself must accept an authenticated `PUT` per file at the path
# the layout script prints (a static host in front of a small writer
# endpoint, or any equivalent -- the transport is the one thing this
# workflow assumes; swap the upload step if the host speaks something else).
#
# Without the signing setup (all three secrets absent), the build degrades
# instead of failing: `MW_DESKTOP_UNSIGNED=1` has release-config.mjs write a
# config without the updater, the app builds without the updater plugin, and
# plain (clearly named) installers attach to a release titled "(unsigned
# installers)". The feed job is skipped, so installed apps see no update.
# One secret set but not the others is still a hard failure: half a feed is
# worse than none.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Signed installers (${{ matrix.os }})
    outputs:
      # The feed job runs only when the updater artifacts exist; without the
      # signing secrets there is no manifest to publish.
      signed: ${{ steps.signing.outputs.signed }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; an x86_64 mac build is another entry
        # (macos-13) away, with its own feed path (darwin/x86_64).
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Install Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web install --frozen-lockfile
      - id: signing
        name: Decide signed (updater) or unsigned (plain installers)
        # All three secrets, or none: a half-configured release is a hard
        # failure (release-config.mjs refuses it) rather than a build that
        # signs with one key and feeds from nowhere.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          MW_UPDATER_PUBKEY: ${{ secrets.MW_UPDATER_PUBKEY }}
          MW_DESKTOP_UPDATES_URL: ${{ secrets.MW_DESKTOP_UPDATES_URL }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$MW_UPDATER_PUBKEY" ] && [ -n "$MW_DESKTOP_UPDATES_URL" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "MW_DESKTOP_UPDATER=1" >> "$GITHUB_ENV"
            echo "Signing secrets present: signed artifacts and an updater feed."
          else
            echo "signed=" >> "$GITHUB_OUTPUT"
            echo "MW_DESKTOP_UPDATER=" >> "$GITHUB_ENV"
            echo "MW_DESKTOP_UNSIGNED=1" >> "$GITHUB_ENV"
            echo "::warning::Signing secrets absent -- building UNSIGNED installers without the updater."
          fi
      - name: Write the updater build config (scripts/release-config.mjs)
        # The tag is v0.2.2; the app version is 0.2.2, so the v goes.
        run: MW_RELEASE="${GITHUB_REF_NAME#v}" node scripts/release-config.mjs
        env:
          MW_UPDATER_PUBKEY: ${{ secrets.MW_UPDATER_PUBKEY }}
          MW_DESKTOP_CHANNEL: ${{ vars.MW_DESKTOP_CHANNEL || 'prod' }}
          MW_DESKTOP_UPDATES_URL: ${{ secrets.MW_DESKTOP_UPDATES_URL }}
          MW_DESKTOP_UNSIGNED: ${{ env.MW_DESKTOP_UNSIGNED }}
      - name: Build, sign and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundler signs the updater artifacts (setup.exe, .app.tar.gz,
          # AppImage) with this; the manifests carry the signatures.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at build time by the Rust side (src-tauri/src/lib.rs,
          # src-tauri/src/updater.rs): which API and whether the updater
          # exists are properties of the build. Empty on the unsigned path,
          # where the plain installers ship and no updater is registered.
          MW_DESKTOP_BASE_URL: ${{ vars.MW_DESKTOP_BASE_URL || 'https://app.matterwave.ai' }}
          MW_DESKTOP_UPDATER: ${{ env.MW_DESKTOP_UPDATER }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          # The config release-config.mjs wrote: real pubkey, per-channel
          # endpoint, createUpdaterArtifacts on -- or, unsigned, no updater.
          args: --config src-tauri/tauri.release.json
          tagName: ${{ github.ref_name }}
          releaseName: MatterWave ${{ github.ref_name }}${{ steps.signing.outputs.signed == '1' && '' || ' (unsigned installers)' }}
          releaseBody: >
            Installers for Windows (MSI and NSIS), macOS (app bundle) and
            Linux (AppImage and .deb). ${{ steps.signing.outputs.signed == '1' && '`latest.json` is the updater manifest for the feed; `.sig` files are its artifact signatures.' || 'Unsigned build: no updater manifest, no auto-update; installed apps keep asking the previous feed.' }}
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdaterJson: ${{ steps.signing.outputs.signed == '1' }}

  feed:
    name: Publish the updater feed
    needs: build
    # Nothing to lay out when the release shipped unsigned: the feed keeps
    # serving the previous version, and installed apps see no update.
    if: needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*-setup.exe" --pattern "*.msi" --pattern "*.msi.sig" \
            --pattern "*.app.tar.gz" --pattern "*.AppImage" --pattern "*.deb" \
            --dir release
          ls -l release
      - name: Lay out the feed (scripts/publish-updater-manifest.mjs)
        run: |
          node scripts/publish-updater-manifest.mjs \
            --artifacts release \
            --manifest release/latest.json \
            --channel "${MW_DESKTOP_CHANNEL:-prod}" \
            --base "$MW_DESKTOP_UPDATES_URL" \
            --out feed
        env:
          MW_DESKTOP_UPDATES_URL: ${{ secrets.MW_DESKTOP_UPDATES_URL }}
          MW_DESKTOP_CHANNEL: ${{ vars.MW_DESKTOP_CHANNEL || 'prod' }}
      - name: Upload the feed
        env:
          MW_DESKTOP_UPDATES_URL: ${{ secrets.MW_DESKTOP_UPDATES_URL }}
          MW_DESKTOP_CHANNEL: ${{ vars.MW_DESKTOP_CHANNEL || 'prod' }}
          MW_UPDATER_FEED_TOKEN: ${{ secrets.MW_UPDATER_FEED_TOKEN }}
        run: |
          if [ -z "$MW_UPDATER_FEED_TOKEN" ]; then
            echo "MW_UPDATER_FEED_TOKEN is not set: the release is published, the feed keeps the previous version."
            exit 0
          fi
          status=0
          while IFS= read -r file; do
            # feed/desktop/<channel>/<os>/<arch>/<file> uploads at the same
            # path, which is the endpoint the app asks for.
            path="${file#feed/}"
            url="$MW_DESKTOP_UPDATES_URL/$path"
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --request PUT --header "Authorization: Bearer $MW_UPDATER_FEED_TOKEN" \
              --data-binary "@$file" "$url")
            echo "PUT $path -> HTTP $code"
            case "$code" in 2*) ;; *) status=1 ;; esac
          done < <(find feed -type f | sort)
          exit $status
